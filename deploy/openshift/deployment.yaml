apiVersion: apps/v1
kind: Deployment
metadata:
  name: paa-pub
  labels:
    app: paa-pub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paa-pub
  template:
    metadata:
      labels:
        app: paa-pub
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: paa-pub
          image: image-registry.openshift-image-registry.svc:5000/NAMESPACE/paa-pub:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: paa-pub-config
            - secretRef:
                name: paa-pub-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: paa-pub
  labels:
    app: paa-pub
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: paa-pub
