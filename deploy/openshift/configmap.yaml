apiVersion: v1
kind: ConfigMap
metadata:
  name: paa-pub-config
  labels:
    app: paa-pub
data:
  PAA_USERNAME: "admin"
  PAA_DOMAIN: ""
  PAA_STORAGE_LIMIT: "1GB"
  PAA_FEED_LIMIT: "50"
  PAA_REGISTRATION: "open"
  PAA_SERVER_PORT: "3000"
  PAA_SNAPSHOT_INTERVAL: "30000"
  MINIO_ENDPOINT: "paa-minio"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: "paa-pub"
